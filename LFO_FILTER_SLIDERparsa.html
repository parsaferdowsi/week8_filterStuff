<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>filter and lfo</title>
  </head>
  <body>
    <input
      id="freq"
      type="range"
      min="1"
      max="40"
      step="0.1"
      value="0.1"
    /><label id="CutOff_Display">CutOff_Range</label>
    <input
      id="rate"
      type="range"
      min="0.125"
      max="10"
      step="0.001"
      value="3"
    /><label id="Rate_Display">Rate_Range</label>

    <script>
      const ctx = new AudioContext();

      const mainOsc = new OscillatorNode(ctx);
      mainOsc.type = "triangle";
      mainOsc.frequency.value = 55;

      const gain = new GainNode(ctx);
      gain.gain.value = 0.3;

      mainOsc.connect(gain);

      const lpFilter = new BiquadFilterNode(ctx);
      lpFilter.type = "lowpass";
      lpFilter.frequency = 800;
      lpFilter.Q = 10;

      const lfo = new OscillatorNode(ctx);
      lfo.type = "sine";

      const lfoDepth = new GainNode(ctx);

      lfo.connect(lfoDepth);
      lfoDepth.connect(lpFilter.frequency);

      mainOsc.connect(lpFilter);
      lpFilter.connect(ctx.destination);

      mainOsc.start();
      lfo.start();

      const slider1 = document.querySelector("#freq");
      slider1.addEventListener("input", () => {
        ctx.resume();
        lfoDepth.gain.value = 100 * Number(slider1.value);
        document.querySelector("#CutOff_Display").textContent = slider1.value;
      });

      const slider2 = document.querySelector("#rate");
      slider2.addEventListener("input", () => {
        ctx.resume();
        lfo.frequency.value = Number(slider2.value);
        document.querySelector("#Rate_Display").textConent = slider2.value;
      });
    </script>
  </body>
</html>
